name: Daily News & Podcast Briefing

on:
  schedule:
    # 7:00 AM Mountain Time (America/Edmonton)
    # 13:00 UTC during MDT (UTC-6) / 14:00 UTC during MST (UTC-7)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Podcast Cover Art
        run: |
          python utils/cover_art.py

      - name: Execute PodCow Multi-Podcast Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TIMEZONE: "America/Edmonton"
          SCHEDULE_TIME: "07:00"
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gemini' }}
        run: |
          python main.py --run-now --show all

      - name: Publish Podcast Episodes to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ="America/Edmonton" date +'%Y%m%d')
          TAG="v${DATE}"
          MP3_FILES=$(ls output/*.mp3 2>/dev/null || true)
          if [ -n "$MP3_FILES" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh release create "$TAG" output/*.mp3 --title "PodCow Daily Episodes - $DATE" --notes "Daily Podcast episodes for PodCow Daily News Edmonton, Podcow Oilers and NHL Daily, and Podcow Global AI Daily."
          fi

      - name: Commit Feed Updates and Episode History to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/*.xml public/*.json public/assets/*.jpg
          git diff --staged --quiet || git commit -m "Update daily podcast feeds and episode archive [skip ci]"
          git push origin main || echo "Git push skipped"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Artifacts (HTML & Podcast Audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-output
          path: output/
          retention-days: 7
